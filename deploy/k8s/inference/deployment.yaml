apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: inference
  labels:
    app.kubernetes.io/name: llama-server
    app.kubernetes.io/part-of: krakozhia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-server
        app.kubernetes.io/part-of: krakozhia
    spec:
      automountServiceAccountToken: false
      # Optional: pin to a specific GPU worker node.
      # nodeSelector:
      #   kubernetes.io/hostname: gpu-node-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model-downloader
          image: docker.io/curlimages/curl:8.23.0
          command:
            - sh
            - -eu
            - -c
            - |
              download() {
                dst="$1"
                url="$2"
                if [ ! -s "$dst" ]; then
                  curl -fsSL -o "${dst}.tmp" "$url"
                  mv "${dst}.tmp" "$dst"
                fi
              }
              download /models/Qwen3-Embedding-0.6B-Q8_0.gguf https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
              download /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf https://huggingface.co/unsloth/gemma-4-12B-it-qat-GGUF/resolve/main/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
              download /models/bge-reranker-v2-m3-Q8_0.gguf https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          # Vulkan build for AMD GPUs; use server-cuda and nvidia.com/gpu on NVIDIA nodes.
          image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:1ba441f2843f86e99ec64a218c427bd2d391393a73b39b9ec2c2e69a0ae9be4e
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --models-preset
            - /config/models.ini
            - --models-max
            - "4"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              amd.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 5Gi
              amd.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
        - name: config
          configMap:
            name: llama-models-preset
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
