# Template only. Encrypt with SOPS/KSOPS, sync via External Secrets, or create with kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: krakozhia-config
  namespace: krakozhia
type: Opaque
stringData:
  KRAKOZHIA_DB_DSN: "postgres://krakozhia:CHANGE_ME@postgres.database.svc.cluster.local:5432/krakozhia?sslmode=require"
  KRAKOZHIA_API_TOKEN: "CHANGE_ME_API_TOKEN"
  # Optional read-only fine-grained PAT for GitHub roadmap sync.
  KRAKOZHIA_GITHUB_TOKEN: "CHANGE_ME_GITHUB_TOKEN"
